<!DOCTYPE html>
<html>
    <head>
        <title>Worlds Smartest Website</title>
    </head>
    <body>
        <h1>The world smartest website says:</h1>
        <h3 id="text"></h3>
        <script>
            const queryString = window.location.search;
            const urlParams = new URLSearchParams(queryString)
            const searchItem = urlParams.get("text")
            if (searchItem) {
                document.getElementById("text").textContent = searchitem
            }
        </script>
    </body>
</html>
